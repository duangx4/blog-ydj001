{{ define "main" }}
<article class="now-page">
  <header style="text-align:center;margin-bottom:2.5rem">
    <h1>{{ .Title | emojify }}</h1>
    {{ with .Params.lastmod }}
      <span style="display:inline-block;font-family:'JetBrains Mono',Consolas,monospace;font-size:.8rem;color:var(--stone-blue);background:color-mix(in srgb,var(--stone-blue) 10%,transparent);padding:.2rem .75rem;border-radius:999px;letter-spacing:.06em">
        UPDATED · {{ .Format "2006-01-02" }}
      </span>
    {{ end }}
  </header>

  <div class="prose">
    {{ .Content }}
  </div>

  <footer style="margin-top:3rem;padding-top:1.5rem;border-top:1px dashed var(--line);text-align:center;font-size:.82rem;color:var(--ink-meta)">
    <p>灵感来源：<a href="https://nownownow.com/about" target="_blank" rel="noopener">nownownow.com</a></p>
  </footer>
</article>
{{ end }}
