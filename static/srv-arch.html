<!doctype html>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>MC 服务器玩家入口架构</title>
<style>
  :root {
    color-scheme: light dark;
    --bg: #f8fafc;
    --fg: #172033;
    --muted: #5b6475;
    --line: #64748b;
    --neutral: #e2e8f0;
    --input: #bfdbfe;
    --process: #c7d2fe;
    --storage: #99f6e4;
    --external: #fde68a;
    --risk: #fecaca;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #0f172a;
      --fg: #e5e7eb;
      --muted: #a3adbd;
      --line: #94a3b8;
      --neutral: #334155;
      --input: #1d4ed8;
      --process: #4338ca;
      --storage: #0f766e;
      --external: #92400e;
      --risk: #991b1b;
    }
  }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--fg);
    font: 14px/1.4 ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
  }
  main { max-width: 1240px; margin: 24px auto; padding: 0 16px; }
  svg { width: 100%; height: auto; display: block; }
  .title { font-size: 20px; font-weight: 650; fill: var(--fg); }
  .label { font-size: 14px; font-weight: 600; fill: var(--fg); }
  .small { font-size: 12px; fill: var(--muted); }
  .mono { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; }
  .node { stroke: var(--line); stroke-width: 1; }
  .neutral { fill: var(--neutral); }
  .input { fill: var(--input); }
  .process { fill: var(--process); }
  .storage { fill: var(--storage); }
  .external { fill: var(--external); }
  .risk { fill: var(--risk); }
  .edge { stroke: var(--line); stroke-width: 1.5; fill: none; }
  .zone { fill: none; stroke: var(--line); stroke-width: 1; stroke-dasharray: 6 5; opacity: 0.8; }
</style>
<main>
<svg viewBox="0 0 1240 720" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="var(--line)" />
    </marker>
  </defs>

  <text x="20" y="36" class="title">MC 服务器玩家入口架构（2026-08-12 实测）</text>
  <text x="20" y="58" class="small">DNS 与端口连通性均经实际验证 · 香港 = SRV 解析入口 · 浙江 = frp 直连入口</text>

  <!-- 连线（先画） -->
  <!-- 玩家 → 香港 SRV 入口 -->
  <path class="edge" marker-end="url(#arrow)" d="M 200 355 L 282 165" />
  <!-- 玩家 → 浙江 frp 入口 -->
  <path class="edge" marker-end="url(#arrow)" d="M 200 395 L 282 525" />
  <!-- 香港 SRV → 香港机 -->
  <path class="edge" marker-end="url(#arrow)" d="M 545 145 L 615 145" />
  <!-- 香港机 → VM MC 服 -->
  <path class="edge" marker-end="url(#arrow)" d="M 840 145 L 880 145 L 880 360 L 918 360" />
  <text x="852" y="138" class="small">frp 隧道 (frps 0.61.2)</text>
  <!-- 浙江 frp → VM MC 服 -->
  <path class="edge" marker-end="url(#arrow)" d="M 545 525 L 880 525 L 880 420 L 918 420" />
  <text x="852" y="518" class="small">frp 隧道</text>
  <!-- DNS SRV 解析虚线 -->
  <path class="zone" marker-end="url(#arrow)" d="M 410 215 L 700 215 L 700 55" />
  <text x="416" y="208" class="small mono">SRV: _minecraft._tcp.hkmc.ydj001.xyz → hk.ydj001.xyz:25565</text>

  <!-- 玩家 -->
  <rect class="node external" x="40" y="330" width="160" height="100" rx="10" />
  <text x="120" y="372" class="label" text-anchor="middle">玩家</text>
  <text x="120" y="392" class="small" text-anchor="middle">Minecraft 客户端</text>
  <text x="120" y="410" class="small" text-anchor="middle">1.20.1</text>

  <!-- 香港 SRV 入口 -->
  <rect class="node input" x="282" y="80" width="263" height="130" rx="10" />
  <text x="413" y="106" class="label" text-anchor="middle" class="mono">hkmc.ydj001.xyz</text>
  <text x="413" y="128" class="small" text-anchor="middle">SRV 记录 → 自动带端口</text>
  <text x="413" y="148" class="small mono" text-anchor="middle">hk.ydj001.xyz:25565</text>
  <text x="413" y="170" class="small" text-anchor="middle">优先 0 · 权重 0 · TTL 300</text>
  <text x="413" y="192" class="small" text-anchor="middle">✅ TCP 连通</text>

  <!-- 香港机 frps -->
  <rect class="node process" x="615" y="80" width="225" height="130" rx="10" />
  <text x="727" y="106" class="label" text-anchor="middle">香港机 (frps)</text>
  <text x="727" y="128" class="small mono" text-anchor="middle">154.12.85.12</text>
  <text x="727" y="148" class="small" text-anchor="middle">Ubuntu 24.04 · frps 0.61.2</text>
  <text x="727" y="170" class="small" text-anchor="middle">Nginx 反代 Web 服务</text>
  <text x="727" y="192" class="small" text-anchor="middle">公网门户</text>

  <!-- 浙江 frp 入口 -->
  <rect class="node input" x="282" y="460" width="263" height="130" rx="10" />
  <text x="413" y="486" class="label" text-anchor="middle" class="mono">hj.wwszxc.tax:31552</text>
  <text x="413" y="508" class="small" text-anchor="middle">frp 直连入口（无 SRV）</text>
  <text x="413" y="528" class="small mono" text-anchor="middle">103.236.89.106</text>
  <text x="413" y="550" class="small" text-anchor="middle">✅ TCP 连通</text>
  <text x="413" y="572" class="small" text-anchor="middle">备用入口</text>

  <!-- VM 机 MC 服 -->
  <rect class="node storage" x="918" y="260" width="280" height="220" rx="10" />
  <text x="1058" y="290" class="label" text-anchor="middle">VM 机 · MC 服务器</text>
  <text x="1058" y="314" class="small" text-anchor="middle">Debian 13 · Docker</text>
  <text x="1058" y="336" class="small mono" text-anchor="middle">Fabric 1.20.1</text>
  <text x="1058" y="358" class="small" text-anchor="middle">MCDR 2.15.7 管理</text>
  <text x="1058" y="380" class="small" text-anchor="middle">Dynmap 8123 · RCON 25575</text>
  <text x="1058" y="402" class="small" text-anchor="middle">世界存档 7.4G</text>
  <text x="1058" y="424" class="small" text-anchor="middle">✅ 25565 正常</text>

  <!-- 图例 -->
  <rect class="node external" x="40" y="640" width="18" height="18" rx="4" />
  <text x="66" y="654" class="small">外部用户</text>
  <rect class="node input" x="150" y="640" width="18" height="18" rx="4" />
  <text x="176" y="654" class="small">入口 / 隧道</text>
  <rect class="node process" x="270" y="640" width="18" height="18" rx="4" />
  <text x="296" y="654" class="small">中转节点</text>
  <rect class="node storage" x="390" y="640" width="18" height="18" rx="4" />
  <text x="416" y="654" class="small">目标服务器</text>
</svg>
</main>
