<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630" role="img" aria-label="ydj001.xyz 分享卡">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%"  stop-color="#082f49"/>
      <stop offset="50%" stop-color="#0c4a6e"/>
      <stop offset="100%" stop-color="#155e75"/>
    </linearGradient>
    <linearGradient id="ring" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%"  stop-color="#7dd3fc"/>
      <stop offset="100%" stop-color="#0ea5e9"/>
    </linearGradient>
    <radialGradient id="glow" cx="20%" cy="20%" r="50%">
      <stop offset="0%"  stop-color="#38bdf8" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#38bdf8" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid" x="0" y="0" width="60" height="60" patternUnits="userSpaceOnUse">
      <path d="M 60 0 L 0 0 0 60" fill="none" stroke="#7dd3fc" stroke-opacity="0.10" stroke-width="1"/>
    </pattern>
    <pattern id="dots" x="0" y="0" width="40" height="40" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1.2" fill="#7dd3fc" fill-opacity="0.20"/>
    </pattern>
  </defs>

  <!-- 背景层 -->
  <rect width="1200" height="630" fill="url(#bg)"/>
  <rect width="1200" height="630" fill="url(#grid)"/>
  <rect width="1200" height="630" fill="url(#dots)"/>
  <rect width="1200" height="630" fill="url(#glow)"/>

  <!-- 右上角装饰圆环 -->
  <g transform="translate(990 130)">
    <circle r="160" fill="none" stroke="url(#ring)" stroke-width="2.5" stroke-opacity="0.45"/>
    <circle r="110" fill="none" stroke="url(#ring)" stroke-width="2" stroke-opacity="0.35"/>
    <circle r="60"  fill="#0ea5e9" fill-opacity="0.15"/>
    <circle r="20"  fill="#38bdf8" fill-opacity="0.55"/>
  </g>

  <!-- 左下角装饰小圆 -->
  <g transform="translate(180 510)">
    <circle r="80" fill="none" stroke="#7dd3fc" stroke-width="1.5" stroke-opacity="0.30"/>
    <circle r="40" fill="#0ea5e9" fill-opacity="0.12"/>
  </g>

  <!-- 主标题 -->
  <text x="80" y="260" font-family="'LXGW WenKai', 'Songti SC', 'KaiTi', serif" font-size="92" font-weight="700" fill="#f0f9ff" letter-spacing="3">
    实力人老大
  </text>

  <!-- 副标题 -->
  <text x="82" y="320" font-family="'Noto Sans SC', 'Microsoft YaHei', sans-serif" font-size="32" font-weight="500" fill="#7dd3fc" letter-spacing="6">
    电气工程 · 无人机飞手 · 折腾爱好者
  </text>

  <!-- 描述行 -->
  <text x="82" y="400" font-family="'Noto Sans SC', sans-serif" font-size="22" font-weight="400" fill="#cbd5e1" opacity="0.85">
    电气 · 嵌入式 · 无人机 · Docker · Hugo · MC
  </text>

  <!-- 域名水印 -->
  <text x="80" y="560" font-family="'JetBrains Mono', Consolas, monospace" font-size="22" fill="#38bdf8" fill-opacity="0.85" letter-spacing="3">
    ydj001.xyz
  </text>

  <!-- 右侧 mono 装饰文本 -->
  <g transform="translate(1010 540)" font-family="'JetBrains Mono', Consolas, monospace" font-size="13" fill="#7dd3fc" fill-opacity="0.55" text-anchor="end">
    <text x="0" y="0">$ hugo --minify</text>
    <text x="0" y="22" fill-opacity="0.40">Built in 1.2s · 12 pages</text>
  </g>
</svg>
