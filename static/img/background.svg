<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" preserveAspectRatio="xMidYMid slice" role="img" aria-label="ydj001.xyz 默认背景">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%"  stop-color="#082f49"/>
      <stop offset="55%" stop-color="#0c4a6e"/>
      <stop offset="100%" stop-color="#155e75"/>
    </linearGradient>
    <radialGradient id="glow1" cx="20%" cy="25%" r="40%">
      <stop offset="0%"  stop-color="#0ea5e9" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#0ea5e9" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glow2" cx="85%" cy="80%" r="45%">
      <stop offset="0%"  stop-color="#38bdf8" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="#38bdf8" stop-opacity="0"/>
    </radialGradient>
    <pattern id="dots" x="0" y="0" width="48" height="48" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1" fill="#38bdf8" fill-opacity="0.18"/>
    </pattern>
  </defs>

  <!-- 基础渐变 -->
  <rect width="1600" height="900" fill="url(#bg)"/>
  <!-- 点阵纹理 -->
  <rect width="1600" height="900" fill="url(#dots)"/>
  <!-- 两个柔和光晕 -->
  <rect width="1600" height="900" fill="url(#glow1)"/>
  <rect width="1600" height="900" fill="url(#glow2)"/>
</svg>
