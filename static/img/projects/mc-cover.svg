<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 480" role="img" aria-label="MC 模组服">
  <defs>
    <linearGradient id="bg2" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#064e3b"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
    <linearGradient id="grass" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#22c55e"/>
      <stop offset="100%" stop-color="#15803d"/>
    </linearGradient>
    <linearGradient id="dirt" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#92400e"/>
      <stop offset="100%" stop-color="#451a03"/>
    </linearGradient>
  </defs>
  <rect width="800" height="480" fill="url(#bg2)"/>
  <!-- 天空 -->
  <rect width="800" height="280" fill="#0c4a6e" opacity="0.6"/>
  <!-- 像素方块云 -->
  <g fill="#7dd3fc" opacity="0.7">
    <rect x="120" y="80" width="60" height="20"/>
    <rect x="100" y="100" width="100" height="20"/>
    <rect x="120" y="120" width="60" height="20"/>
    <rect x="600" y="60" width="80" height="20"/>
    <rect x="580" y="80" width="120" height="20"/>
    <rect x="600" y="100" width="80" height="20"/>
  </g>
  <!-- 太阳 -->
  <rect x="680" y="100" width="40" height="40" fill="#fde047"/>
  <rect x="660" y="120" width="80" height="20" fill="#fde047"/>
  <rect x="680" y="80" width="40" height="40" fill="#fde047"/>
  <!-- 远山 -->
  <polygon points="0,280 200,180 400,260 600,160 800,240 800,280" fill="#1e293b" opacity="0.8"/>
  <!-- 地面 -->
  <rect y="280" width="800" height="200" fill="url(#grass)"/>
  <!-- 像素草地分层 -->
  <g fill="#15803d">
    <rect y="280" width="800" height="20"/>
  </g>
  <!-- 像素树 -->
  <g>
    <rect x="180" y="240" width="20" height="40" fill="#78350f"/>
    <rect x="160" y="220" width="60" height="20" fill="#22c55e"/>
    <rect x="150" y="200" width="80" height="20" fill="#22c55e"/>
    <rect x="160" y="180" width="60" height="20" fill="#16a34a"/>
    <rect x="560" y="240" width="20" height="40" fill="#78350f"/>
    <rect x="540" y="220" width="60" height="20" fill="#22c55e"/>
    <rect x="530" y="200" width="80" height="20" fill="#22c55e"/>
    <rect x="540" y="180" width="60" height="20" fill="#16a34a"/>
  </g>
  <!-- 中心方块角色 (Steve 风格简化) -->
  <g transform="translate(360 220)">
    <!-- 头 -->
    <rect x="0" y="0" width="80" height="80" fill="#d4a574"/>
    <rect x="10" y="20" width="20" height="10" fill="#1f2937"/>
    <rect x="50" y="20" width="20" height="10" fill="#1f2937"/>
    <rect x="20" y="55" width="40" height="8" fill="#78350f"/>
    <!-- 身体 -->
    <rect x="0" y="80" width="80" height="60" fill="#0ea5e9"/>
    <!-- 腿 -->
    <rect x="10" y="140" width="28" height="40" fill="#1e3a8a"/>
    <rect x="42" y="140" width="28" height="40" fill="#1e3a8a"/>
  </g>
  <!-- 标题 -->
  <text x="40" y="50" fill="#7dd3fc" font-family="ui-monospace,monospace" font-size="13" font-weight="700" letter-spacing="2">MINECRAFT · FABRIC SERVER</text>
  <text x="40" y="455" fill="#64748b" font-family="ui-monospace,monospace" font-size="11">1.21 + Fabric mods + EasyBot</text>
</svg>