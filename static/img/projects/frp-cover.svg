<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 480" role="img" aria-label="FRP 内网穿透矩阵">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#0c4a6e"/>
    </linearGradient>
    <linearGradient id="line" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#0ea5e9" stop-opacity="0.2"/>
      <stop offset="50%" stop-color="#38bdf8" stop-opacity="1"/>
      <stop offset="100%" stop-color="#7dd3fc" stop-opacity="0.2"/>
    </linearGradient>
    <radialGradient id="glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.5"/>
      <stop offset="100%" stop-color="#38bdf8" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="800" height="480" fill="url(#bg)"/>
  <!-- 网格背景 -->
  <g stroke="#0ea5e9" stroke-opacity="0.08" stroke-width="1">
    <line x1="0" y1="60" x2="800" y2="60"/>
    <line x1="0" y1="120" x2="800" y2="120"/>
    <line x1="0" y1="180" x2="800" y2="180"/>
    <line x1="0" y1="240" x2="800" y2="240"/>
    <line x1="0" y1="300" x2="800" y2="300"/>
    <line x1="0" y1="360" x2="800" y2="360"/>
    <line x1="0" y1="420" x2="800" y2="420"/>
    <line x1="160" y1="0" x2="160" y2="480"/>
    <line x1="320" y1="0" x2="320" y2="480"/>
    <line x1="480" y1="0" x2="480" y2="480"/>
    <line x1="640" y1="0" x2="640" y2="480"/>
  </g>
  <!-- 中心节点 (VPS) -->
  <circle cx="400" cy="240" r="80" fill="url(#glow)"/>
  <rect x="350" y="200" width="100" height="80" rx="10" fill="#0c4a6e" stroke="#38bdf8" stroke-width="2"/>
  <text x="400" y="232" text-anchor="middle" fill="#7dd3fc" font-family="ui-monospace,monospace" font-size="14" font-weight="700">VPS</text>
  <text x="400" y="252" text-anchor="middle" fill="#94a3b8" font-family="ui-monospace,monospace" font-size="11">154.12.85.12</text>
  <!-- 5 个内网节点 -->
  <g>
    <circle cx="160" cy="120" r="32" fill="#0f172a" stroke="url(#line)" stroke-width="2"/>
    <text x="160" y="124" text-anchor="middle" fill="#e2e8f0" font-family="ui-monospace,monospace" font-size="11" font-weight="600">blog</text>

    <circle cx="640" cy="120" r="32" fill="#0f172a" stroke="url(#line)" stroke-width="2"/>
    <text x="640" y="124" text-anchor="middle" fill="#e2e8f0" font-family="ui-monospace,monospace" font-size="11" font-weight="600">bot</text>

    <circle cx="160" cy="360" r="32" fill="#0f172a" stroke="url(#line)" stroke-width="2"/>
    <text x="160" y="364" text-anchor="middle" fill="#e2e8f0" font-family="ui-monospace,monospace" font-size="11" font-weight="600">mc</text>

    <circle cx="640" cy="360" r="32" fill="#0f172a" stroke="url(#line)" stroke-width="2"/>
    <text x="640" y="364" text-anchor="middle" fill="#e2e8f0" font-family="ui-monospace,monospace" font-size="11" font-weight="600">frp</text>

    <circle cx="400" cy="420" r="32" fill="#0f172a" stroke="url(#line)" stroke-width="2"/>
    <text x="400" y="424" text-anchor="middle" fill="#e2e8f0" font-family="ui-monospace,monospace" font-size="10" font-weight="600">easy</text>
  </g>
  <!-- 连线 -->
  <g stroke="url(#line)" stroke-width="2" fill="none">
    <line x1="192" y1="120" x2="350" y2="220"/>
    <line x1="608" y1="120" x2="450" y2="220"/>
    <line x1="192" y1="360" x2="350" y2="260"/>
    <line x1="608" y1="360" x2="450" y2="260"/>
    <line x1="400" y1="388" x2="400" y2="280"/>
  </g>
  <!-- 标签 -->
  <text x="40" y="50" fill="#38bdf8" font-family="ui-monospace,monospace" font-size="13" font-weight="700" letter-spacing="2">FRP · INTERNAL TUNNEL MATRIX</text>
  <text x="40" y="455" fill="#64748b" font-family="ui-monospace,monospace" font-size="11">5 subdomains · TLS · Cloudflare</text>
</svg>