# Sveltia CMS 配置（资源发布后台，访问 https://ydj001.xyz/admin/）
# 文档：https://sveltiacms.app/en/docs

backend:
  name: github
  repo: duangx4/blog-ydj001
  branch: master
  # OAuth 中转（sveltia-cms-auth，部署好后填入并取消注释）。
  # 未配置前只能用后台登录页的「Sign In with Token」（GitHub PAT）登录。
  # base_url: https://oauth.ydj001.xyz
  squash_merges: true

# 保存 = 建分支 cms/resources/<slug> + 开 PR；站主审核合并后才会上线
publish_mode: editorial_workflow

site_url: https://ydj001.xyz
display_url: https://ydj001.xyz

# 全局媒体（仅作兜底；资源文章的图片/附件都跟随文章目录）
media_folder: static/img/uploads
public_folder: /img/uploads

media_libraries:
  default:
    config:
      # 单文件上限 20 MB；更大的请传网盘，用「网盘卡片」组件
      max_file_size: 20971520

slug:
  encoding: ascii
  clean_accents: true

collections:
  - name: resources
    label: 资源分享
    label_singular: 资源
    description: 每篇资源一个目录（content/resources/<slug>/index.md），图片和附件都放在文章目录里。
    folder: content/resources
    path: "{{slug}}/index"
    media_folder: ""
    public_folder: ""
    format: yaml-frontmatter
    create: true
    # 删除按钮开关。关掉它只是把入口藏起来，真正的防线是
    # .github/workflows/resource-ownership.yml 的归属校验：
    # 只有本人署名的文章才允许删，别人删会被打回。
    delete: true
    identifier_field: title
    slug:
      editable: [create]
      hint: 文章目录名，只能用小写字母、数字和连字符，例如 stm32-template。创建后不可修改。
      pattern: ['^[a-z0-9]+(-[a-z0-9]+)*$', '只能用小写字母、数字和连字符']
    summary: "{{title}} · {{authors}}"
    sortable_fields: [date, weight, title]
    fields:
      - { name: title, label: 标题, widget: string }
      - name: authors
        label: 贡献者 GitHub 用户名
        widget: list
        hint: 填你自己的 GitHub 用户名（登录名，不是昵称）。合并前会自动校验，只能改署名是自己的文章。
        min: 1
        max: 1
      - { name: date, label: 发布时间, widget: datetime, format: "YYYY-MM-DDTHH:mm:ssZ" }
      - { name: lastmod, label: 最后更新, widget: datetime, format: "YYYY-MM-DDTHH:mm:ssZ", required: false }
      - { name: draft, label: 草稿（勾选则不在站点显示）, widget: boolean, default: false }
      - { name: weight, label: 排序权重（越小越靠前）, widget: number, value_type: int, default: 10 }
      - { name: description, label: 一句话简介, widget: text, hint: 显示在资源卡片上，说明这是什么、给谁用 }
      - { name: tags, label: 标签, widget: list, required: false, default: [] }
      - name: categories
        label: 分类
        widget: list
        default: ["资源分享"]
      - name: cover
        label: 封面图
        widget: image
        required: false
        hint: 显示在资源列表卡片上，建议 16:9。
      - name: attachments
        label: 附件
        widget: list
        required: false
        hint: 上传后在正文「下载表格」的下载格里填文件名（如 tool-v1.0.zip）即可生成下载按钮。单个文件不超过 20 MB。
        field: { name: file, label: 文件, widget: file }
      - { name: showComments, label: 开启评论区, widget: boolean, default: false }
      - name: body
        label: 正文
        widget: markdown
        hint: >-
          建议结构：这是什么 / 内容清单 / 下载 / 更新日志 / 使用教程 / 常见问题（可参考「资源页模板示范」）。
          工具栏「+」里有「下载表格」和「网盘卡片」两个组件。
        default: |
          ## 这是什么

          一段话讲清：解决什么问题、适合谁。

          ## 内容清单

          - 文件名 / 版本 / 大小

          ## 下载

          {{< download-table caption="下载说明" >}}
          文件名.zip | 1.0 MB | 文件名.zip
          {{< /download-table >}}

          ## 更新日志

          - 首发

          ## 使用教程

          1. 第一步

          ## 常见问题

          **Q：下载链接失效了？**
          A：在留言板反馈，我会尽快补链。

  # ===== 贡献者卡片（资源页顶部的个人名片）=====
  - name: contributors
    label: 我的贡献者卡片
    label_singular: 贡献者卡片
    description: >-
      资源页顶部展示的你的个人名片，每人一张。文件名必须是你的 GitHub 登录名。
      改动保存后会走 PR，站主合并后才会上线。
    folder: content/contributors
    # 头像存到 assets/img/contributors（跟文章封面不同：这里不放 bundle），
    # 由 list.html 通过 resources.Get 读取并裁成 256×256。public_folder 决定写进 front matter 的值。
    media_folder: assets/img/contributors
    public_folder: /img/contributors
    format: yaml-frontmatter
    create: true
    # 同上。注意删卡片不会连带删掉 assets/img/contributors/ 下的头像，
    # 想清干净要另外提交删图片（或在本地删）。
    delete: true
    identifier_field: name
    slug:
      editable: [create]
      hint: 填你的 GitHub 登录名（不是昵称），例如 duangx4。这是归属校验的依据，创建后不可修改。
      pattern: ['^[a-z0-9]+(-[a-z0-9]+)*$', '只能用小写字母、数字和连字符（GitHub 用户名即符合此格式）']
    summary: "{{name}} · {{github}}"
    sortable_fields: [weight, name]
    fields:
      # 注：这里刻意不声明 build 字段。它交给 content/contributors/_index.md 的 cascade
      #   提供；一旦在卡片里显式写上（哪怕是 null），就会覆盖 cascade，卡片会变成独立页面
      #   并进 sitemap。Sveltia 不会丢弃未知的 front matter 键，所以不声明也是安全的。
      - name: github
        label: GitHub 登录名
        widget: string
        hint: 必须与你的登录名完全一致（区分大小写）。CI 会校验，填错会被打回。
      - name: name
        label: 显示名
        widget: string
        hint: 卡片上展示的名字，可以填中文或昵称。
      - name: avatar
        label: 头像
        widget: image
        required: false
        hint: 建议正方形，上传后自动裁成 256×256。不传则显示默认样式。
      - { name: intro, label: 一句话简介, widget: text, required: false, hint: 介绍你的方向或想说的话，一两句即可。 }
      - { name: tags, label: 标签, widget: list, required: false, default: [], hint: 展示你的领域，如 嵌入式 / 汉化 / 搬运。2-5 个比较好看。 }
      - { name: weight, label: 排序权重（越小越靠前）, widget: number, value_type: int, default: 10 }
      - name: links
        label: 链接按钮
        widget: list
        required: false
        max: 4
        hint: 最多 4 个。url 填完整网址，或直接写 github.com/xxx 也会自动补 https://。
        fields:
          - { name: label, label: 按钮文字, widget: string, hint: 如 主页 / 资源仓库 / 联系我 }
          - { name: url, label: 链接, widget: string }
