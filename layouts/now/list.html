{{ define "main" }}

<style>
  .now-container {
    max-width: 42rem;
    margin: 0 auto;
    padding: 3rem 1rem;
  }
  .now-header {
    text-align: center;
    margin-bottom: 2.5rem;
  }
  .now-header h1 {
    font-size: 3rem;
    font-weight: 800;
    letter-spacing: -0.02em;
    margin: 0 0 0.5rem;
  }
  .now-header .now-date {
    display: inline-block;
    font-family: var(--font-mono);
    font-size: 0.85rem;
    color: rgb(14, 165, 233);
    background: rgba(14, 165, 233, 0.1);
    padding: 0.25rem 0.75rem;
    border-radius: 999px;
    letter-spacing: 0.05em;
  }
  .now-content {
    font-size: 1.05rem;
    line-height: 1.85;
  }
  .now-content h2 {
    margin-top: 2rem;
    margin-bottom: 0.75rem;
    font-size: 1.5rem;
    font-weight: 700;
    display: flex;
    align-items: center;
  }
  .now-content h2::before {
    content: "";
    display: inline-block;
    width: 4px;
    height: 1.2em;
    background: rgb(14, 165, 233);
    margin-right: 0.6rem;
    border-radius: 2px;
  }
  .now-content ul {
    padding-left: 1.5rem;
  }
  .now-content li {
    margin-bottom: 0.5rem;
  }
  .now-footer {
    margin-top: 3rem;
    padding-top: 1.5rem;
    border-top: 1px dashed rgba(14, 165, 233, 0.3);
    text-align: center;
    font-size: 0.85rem;
    color: rgb(100, 116, 139);
  }
  blockquote {
    border-left: 3px solid rgb(14, 165, 233);
    padding-left: 1rem;
    margin-left: 0;
    font-style: italic;
    color: rgb(100, 116, 139);
  }
</style>

<article class="now-container">
  <header class="now-header">
    <h1>{{ .Title | emojify }}</h1>
    {{ with .Params.lastmod }}
      <span class="now-date">UPDATED · {{ .Format "2006-01-02" }}</span>
    {{ end }}
  </header>

  <div class="now-content prose dark:prose-invert">
    {{ .Content }}
  </div>

  <footer class="now-footer">
    <p>📮 灵感来源：<a href="https://nownownow.com/about" target="_blank" rel="noopener" class="text-primary-600 dark:text-primary-400">nownownow.com</a></p>
  </footer>
</article>

{{ end }}
