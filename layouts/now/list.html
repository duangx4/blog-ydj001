{{ define "main" }}
<article class="now-page">
  <header class="reveal" style="text-align:center;margin-bottom:2.5rem">
    <h1>{{ .Title | emojify }}</h1>
    {{ with .Params.lastmod }}
      <span class="now-updated-pill">
        UPDATED · {{ .Format "2006-01-02" }}
      </span>
    {{ end }}
  </header>

  <div class="prose reveal" style="--reveal-delay:.06s">
    {{ .Content }}
  </div>

  <footer style="margin-top:3rem;padding-top:1.5rem;border-top:1px dashed var(--line);text-align:center;font-size:.82rem;color:var(--ink-meta)">
    <p>灵感来源：<a href="https://nownownow.com/about" target="_blank" rel="noopener">nownownow.com</a></p>
  </footer>
</article>
{{ end }}
