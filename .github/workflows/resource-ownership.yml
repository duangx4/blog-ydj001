# 资源投稿 PR 的归属校验：贡献者只能新增 / 修改 authors 含自己 GitHub 用户名的资源文章，
# 且不能改动 content/resources/<slug>/ 以外的文件。维护者不受限制。
# 需要配合 master 分支保护，把本检查设为 Required status check。
# 同一文件里还有一个 lint job：跑投稿契约的自检脚本（非 Required，只提示）。
name: resource-ownership

on:
  pull_request:
    branches: [master]

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    env:
      # 维护者 GitHub 用户名，空格分隔
      MAINTAINERS: "duangx4"
      PR_AUTHOR: ${{ github.event.pull_request.user.login }}
      BASE_SHA: ${{ github.event.pull_request.base.sha }}
      HEAD_SHA: ${{ github.event.pull_request.head.sha }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Check ownership
        run: |
          set -euo pipefail

          for m in $MAINTAINERS; do
            if [ "$m" = "$PR_AUTHOR" ]; then
              echo "维护者 $PR_AUTHOR，跳过校验"
              exit 0
            fi
          done

          # 读取某个版本下文章的 authors（不存在返回空）
          authors_at() {
            git show "$1:$2" 2>/dev/null | yq --front-matter=extract '.authors[]' - 2>/dev/null || true
          }

          # 读取某个版本下贡献者卡片的 github 字段（不存在返回空）
          github_at() {
            git show "$1:$2" 2>/dev/null | yq --front-matter=extract '.github' - 2>/dev/null || true
          }

          fail=0
          declare -A seen=()
          while IFS= read -r file; do
            # ---- 贡献者卡片：content/contributors/<用户名>.md ----
            case "$file" in
              content/contributors/_index.md)
                echo "::error file=$file::贡献者目录首页只能由维护者修改"; fail=1; continue ;;
              content/contributors/*)
                slug="${file#content/contributors/}"; slug="${slug%.md}"
                # 只允许单层 .md 文件，挡住 content/contributors/foo/bar.md 这类绕过
                case "$slug" in
                  */*) echo "::error file=$file::贡献者卡片必须是 content/contributors/<用户名>.md"; fail=1; continue ;;
                esac
                # 卡片文件名必须是自己的登录名（删除时同样成立）
                if [ "$slug" != "$PR_AUTHOR" ]; then
                  echo "::error file=$file::卡片文件名必须是你的 GitHub 登录名 $PR_AUTHOR（当前是 $slug）"; fail=1; continue
                fi
                # 已有卡片：原 github 字段属于自己才动得了（防止改掉别人的署名接管卡片）。
                # 注意这条要在「文件是否还在」之前判断——删除后 HEAD 上读不到字段，
                # 只看 HEAD 会把合法删除误判成「github 字段为空」。
                base_github="$(github_at "$BASE_SHA" "$file")"
                if [ -n "$base_github" ] && [ "$base_github" != "$PR_AUTHOR" ]; then
                  echo "::error file=$file::这张卡片属于 $base_github，无权修改"; fail=1; continue
                fi
                # 删除卡片：文件从 HEAD 消失，原署名是自己的就放行
                if ! git cat-file -e "$HEAD_SHA:$file" 2>/dev/null; then
                  if [ -z "$base_github" ]; then
                    echo "::error file=$file::卡片不存在，没有可删除的内容"; fail=1
                  fi
                  continue
                fi
                # 新增 / 修改：github 字段必须填自己
                head_github="$(github_at "$HEAD_SHA" "$file")"
                if [ "$head_github" != "$PR_AUTHOR" ]; then
                  echo "::error file=$file::github 字段必须填 $PR_AUTHOR（当前是 ${head_github:-空}）"; fail=1; continue
                fi
                continue ;;
            esac

            case "$file" in
              content/resources/_index.md)
                echo "::error file=$file::资源区首页只能由维护者修改"; fail=1; continue ;;
              # 贡献者卡片头像（CMS 的 contributors.media_folder 指向这里）。
              # 只放行图片扩展名，避免这里变成往仓库塞任意文件的通道。
              assets/img/contributors/*)
                case "$file" in
                  *.png|*.PNG|*.jpg|*.JPG|*.jpeg|*.JPEG|*.webp|*.WEBP|*.gif|*.GIF|*.svg|*.SVG) continue ;;
                esac
                echo "::error file=$file::头像目录只接受图片文件（png/jpg/jpeg/webp/gif/svg）"; fail=1; continue ;;
              content/resources/*/*)
                slug="${file#content/resources/}"; slug="${slug%%/*}" ;;
              *)
                echo "::error file=$file::贡献者只能修改 content/resources/<slug>/、content/contributors/<用户名>.md 或上传头像"; fail=1; continue ;;
            esac

            # 已有文章：原署名必须是自己（防止改掉别人的署名来接管文章）。
            # 这个判断必须对每个改动的文件都跑，不能因为「这篇已经查过」就跳过：
            # git diff 按字母序输出，cover.png 排在 index.md 前面，先查一次就把 slug
            # 标记成 seen，紧跟的 index.md 会被 continue 掉，归属校验等于没有。
            index="content/resources/$slug/index.md"
            if git cat-file -e "$BASE_SHA:$index" 2>/dev/null; then
              base_authors="$(authors_at "$BASE_SHA" "$index")"
              if ! grep -qxF "$PR_AUTHOR" <<<"$base_authors"; then
                echo "::error file=$index::「$slug」的署名不是 $PR_AUTHOR，无权修改"; fail=1; continue
              fi
            fi
            seen[$slug]=1

            # 修改后的文章：署名仍须包含自己
            if git cat-file -e "$HEAD_SHA:$index" 2>/dev/null; then
              head_authors="$(authors_at "$HEAD_SHA" "$index")"
              if ! grep -qxF "$PR_AUTHOR" <<<"$head_authors"; then
                echo "::error file=$index::authors 必须填你的 GitHub 用户名 $PR_AUTHOR"; fail=1
              fi
            else
              # HEAD 上没有 index.md：两种情况要分开。
              # 「原署名是自己」（上面已校验）→ 本人删除，放行；
              # 「BASE 上本来也没有」→ 新建文章漏了 index.md，或路径写错，拒绝。
              if ! git cat-file -e "$BASE_SHA:$index" 2>/dev/null; then
                echo "::error file=$index::缺少 index.md，资源文章必须是 content/resources/<slug>/index.md"; fail=1
              fi
            fi
          done < <(git diff --name-only "$BASE_SHA...$HEAD_SHA")

          if [ "$fail" -ne 0 ]; then exit 1; fi
          echo "归属校验通过"

  # 契约细节自检：跑的是投稿者在本地跑的那一份脚本（static/agent/check-resource.py）。
  # 不是 Required check——不拦合并，但会把契约问题（字段缺失、附件对不上、超 20 MiB、
  # 短代码写错）在 PR 里点出来，省得合并后才发现。
  # 改契约（static/agent/publish.md）和改这个脚本必须一起改。
  lint:
    runs-on: ubuntu-latest
    env:
      MAINTAINERS: "duangx4"
      PR_AUTHOR: ${{ github.event.pull_request.user.login }}
      BASE_SHA: ${{ github.event.pull_request.base.sha }}
      HEAD_SHA: ${{ github.event.pull_request.head.sha }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Lint changed resource bundles
        run: |
          set -euo pipefail

          # 维护者只跳过署名校验（维护者可能要修别人的老资源），内容契约照查。
          # 这样维护者自己的 PR 也能真正跑到这个 job，不用等外部投稿才知道它通不通。
          author_args=(--author "$PR_AUTHOR")
          for m in $MAINTAINERS; do
            if [ "$m" = "$PR_AUTHOR" ]; then
              echo "维护者 $PR_AUTHOR：跳过署名校验，其余契约照查"
              author_args=()
            fi
          done

          # 本次 PR 改到的资源目录（删除的目录查不到 index.md，下面会跳过）
          slugs="$(git diff --name-only "$BASE_SHA...$HEAD_SHA" -- 'content/resources/' \
                   | awk -F/ 'NF >= 3 { print $3 }' | sort -u || true)"
          if [ -z "$slugs" ]; then
            echo "本 PR 未改动资源文章，跳过契约自检"
            exit 0
          fi

          fail=0
          for slug in $slugs; do
            dir="content/resources/$slug"
            if [ ! -f "$dir/index.md" ]; then
              echo "::notice::$dir 在本次提交里没有 index.md（删除或路径不符），跳过契约自检"
              continue
            fi
            echo "---- $dir ----"
            python3 static/agent/check-resource.py "$dir" "${author_args[@]}" || fail=1
          done
          exit "$fail"
