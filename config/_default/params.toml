# -- 主题参数 --
colorScheme = "ocean"
defaultAppearance = "dark"
autoSwitchAppearance = true

enableA11y = true
enableSearch = true
enableCodeCopy = true
enableStructuredBreadcrumbs = true

replyByEmail = false

mainSections = ["blog"]

disableImageOptimization = false
disableTextInHeader = false

defaultBackgroundImage = "/img/background.svg"
defaultFeaturedImage = "/img/featured.svg"
defaultSocialImage = "img/og-default.png"

highlightCurrentMenuArea = true
smartTOC = true
smartTOCHideUnfocusedChildren = false

fingerprintAlgorithm = "sha512"

# -- 访问分析（Umami）--
# 1. 部署 Umami：自托管（Docker）或注册 umami.is 免费版
# 2. 在 Umami 后台添加站点，拿到 Website ID
# 3. 自托管时填 domain；用 umami.is 官方版则 domain 留空
[umamiAnalytics]
  domain = "umami.ydj001.xyz"   # 你的 Umami 实例域名（留空 = 用 umami.is 官方版）
  websiteid = "75aa75e3-a861-4492-91bb-a74666bd0f3c"
  scriptName = "script.js"
  doNotTrack = false
  enableTrackEvent = true

# -- 评论系统（Giscus）--
# 1. 在 GitHub 仓库开启 Discussions
# 2. 访问 https://giscus.app/zh-CN 配置
# 3. 把生成的 5 个值填到下面
[comments.giscus]
  enable = true
  repo = "duangx4/blog-ydj001"
  repoId = "R_kgDOTgykOw"
  category = "General"
  categoryId = "DIC_kwDOTgykO84DCM3e"
  mapping = "pathname"
  strict = "0"
  reactionsEnabled = "1"
  emitMetadata = "0"
  inputPosition = "bottom"
  theme = "preferred_color_scheme"
  lang = "zh-CN"
  loading = "lazy"

# -- SEO 补充（Blowfish 已自动生成大部分 meta，这里只填额外信息）--
[seo]
  publisher = "ydj001.xyz"
  publisherLogo = "img/logo.svg"
  publisherDescription = "电气工程 / 无人机飞手 / 业余运维 / Hugo + Blowfish"
  twitterSite = ""
  twitterCreator = ""
  ogLanguage = "zh_CN"

# -- 作者信息（首页 profile / about Hero 共同使用）--
# 唯一权威来源：languages.zh-cn.toml 不再重复定义 [params.author]
[author]
  name = "实力人老大"
  image = "img/avatar.jpg"
  imagequality = 96
  headline = "电气工程 · 嵌入式 · 折腾爱好者"
  bio = "电气工程 / 无人机飞手 / 业余运维 / 从 MC 模组服到 Docker 集群"
  links = [
    { github = "https://github.com/duangx4" },
    { wechat = "#" },
    { qq = "#" },
    { email = "2197262637@qq.com" },
    { rss = "/index.xml" },
  ]

[header]
  layout = "fixed"

[footer]
  showMenu = true
  showCopyright = true
  showThemeAttribution = true
  showAppearanceSwitcher = true
  showScrollToTop = true

[homepage]
  layout = "profile"
  showRecent = true
  showRecentItems = 4
  showMoreLink = true
  showMoreLinkDest = "blog"
  cardView = true
  cardViewScreenWidth = false
  layoutBackgroundBlur = true

[article]
  showDate = true
  showViews = false
  showLikes = false
  showDateOnlyInArticle = false
  showDateUpdated = false
  showAuthor = true
  showHero = true
  heroStyle = "background"
  layoutBackgroundBlur = true
  layoutBackgroundHeaderSpace = true
  showBreadcrumbs = true
  showDraftLabel = true
  seriesOpened = false
  showHeadingAnchors = true
  showPagination = true
  invertPagination = false
  showReadingTime = true
  showTableOfContents = true
  showRelatedContent = true
  relatedContentLimit = 5
  showTaxonomies = true
  showAuthorsBadges = true
  showWordCount = true
  sharingLinks = [ "wechat", "weibo", "qq", "telegram", "email" ]
  showZenMode = true

[list]
  showHero = true
  heroStyle = "background"
  layoutBackgroundBlur = true
  layoutBackgroundHeaderSpace = false
  showBreadcrumbs = false
  showSummary = true
  showViews = false
  showLikes = false
  showTableOfContents = false
  showCards = true
  orderByWeight = false
  groupByYear = true
  cardView = true
  cardViewScreenWidth = false
  constrainItemsWidth = false

[sitemap]
  excludedKinds = []

[taxonomy]
  showTermCount = true
  showHero = true
  heroStyle = "background"
  showBreadcrumbs = false
  showViews = false
  showLikes = false
  showTableOfContents = false
  cardView = false

[term]
  showHero = true
  heroStyle = "background"
  showBreadcrumbs = false
  showViews = false
  showLikes = false
  showTableOfContents = false
  groupByYear = false
  cardView = true
  cardViewScreenWidth = false
