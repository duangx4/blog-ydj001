# -- 主题参数 --
colorScheme = "ocean"
defaultAppearance = "dark"
autoSwitchAppearance = true

enableA11y = false
enableSearch = true
enableCodeCopy = true
enableStructuredBreadcrumbs = true

replyByEmail = false

# -- 评论系统（Twikoo 自建，模板见 layouts/partials/comments.html）--
# ⚠ 开关不在本节：主题的判定是 site.Params.article.showComments（见下方 [article]），
#   单篇可用 frontmatter 的 showComments: true 覆盖（默认关 → 逐页开）。
#   本节只存 Twikoo 连接参数。
[comments]
  provider = "twikoo"
  twikooEnvId = "https://twikoo.ydj001.xyz"
  twikooSrc = "https://cdn.jsdelivr.net/npm/twikoo@1.7.15/dist/twikoo.all.min.js"

mainSections = ["blog"]

disableImageOptimization = false
disableTextInHeader = false

defaultBackgroundImage = "/img/background.svg"
defaultFeaturedImage = "/img/featured.svg"
defaultSocialImage = "img/avatar.png"

highlightCurrentMenuArea = true
smartTOC = true
smartTOCHideUnfocusedChildren = false

fingerprintAlgorithm = "sha512"

# -- 作者信息（首页 profile / about Hero 共同使用）--
# 唯一权威来源：languages.zh-cn.toml 不再重复定义 [params.author]
[author]
  name = "实力人老大 · DAX"
  image = "img/avatar.jpg"
  imagequality = 96
  headline = "电气工程 · 嵌入式 · 折腾爱好者"
  bio = "电气工程 / 无人机飞手 / 业余运维 / 从 MC 模组服到 Docker 集群"
  links = [
    { github = "https://github.com/duangx4" },
    { wechat = "#" },
    { qq = "#" },
    { email = "2197262637@qq.com" },
    { rss = "/index.xml" },
  ]

[header]
  layout = "fixed"

[footer]
  showMenu = true
  showCopyright = true
  showThemeAttribution = true
  showAppearanceSwitcher = true
  showScrollToTop = true

[homepage]
  layout = "profile"
  showRecent = true
  showRecentItems = 4
  showMoreLink = true
  showMoreLinkDest = "blog"
  cardView = true
  cardViewScreenWidth = false
  layoutBackgroundBlur = true

[article]
  showDate = true
  showViews = false
  showLikes = false
  showDateOnlyInArticle = false
  showDateUpdated = false
  showAuthor = true
  showHero = true
  heroStyle = "background"
  layoutBackgroundBlur = true
  layoutBackgroundHeaderSpace = true
  showBreadcrumbs = true
  showDraftLabel = true
  seriesOpened = false
  showHeadingAnchors = true
  showPagination = true
  invertPagination = false
  showReadingTime = true
  showTableOfContents = true
  showRelatedContent = true
  relatedContentLimit = 5
  showTaxonomies = true
  showAuthorsBadges = true
  showWordCount = true
  sharingLinks = [ "wechat", "weibo", "qq", "telegram", "email" ]
  showZenMode = true

# -- 评论区总开关 --
# 全站默认关闭（false）；单篇 frontmatter 写 showComments: true 即可开启，
# 需要 Twikoo 连接参数时见上方 [comments] 段。
showComments = false

[list]
  showHero = true
  heroStyle = "background"
  layoutBackgroundBlur = true
  layoutBackgroundHeaderSpace = false
  showBreadcrumbs = false
  showSummary = true
  showViews = false
  showLikes = false
  showTableOfContents = false
  showCards = true
  orderByWeight = false
  groupByYear = true
  cardView = true
  cardViewScreenWidth = false
  constrainItemsWidth = false

[sitemap]
  excludedKinds = []

[taxonomy]
  showTermCount = true
  showHero = true
  heroStyle = "background"
  showBreadcrumbs = false
  showViews = false
  showLikes = false
  showTableOfContents = false
  cardView = false

[term]
  showHero = true
  heroStyle = "background"
  showBreadcrumbs = false
  showViews = false
  showLikes = false
  showTableOfContents = false
  groupByYear = false
  cardView = true
  cardViewScreenWidth = false
