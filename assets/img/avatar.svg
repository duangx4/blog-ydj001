<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 288 288" role="img" aria-label="实力人老大 头像">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0c4a6e"/>
      <stop offset="50%" stop-color="#0e7490"/>
      <stop offset="100%" stop-color="#155e75"/>
    </linearGradient>
    <linearGradient id="ring" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#0ea5e9"/>
    </linearGradient>
  </defs>
  <!-- 背景 -->
  <rect width="288" height="288" fill="url(#bg)"/>
  <!-- 装饰点阵 -->
  <g fill="#7dd3fc" opacity="0.18">
    <circle cx="40" cy="50" r="2"/>
    <circle cx="80" cy="30" r="2"/>
    <circle cx="120" cy="60" r="2"/>
    <circle cx="180" cy="40" r="2"/>
    <circle cx="230" cy="70" r="2"/>
    <circle cx="260" cy="50" r="2"/>
    <circle cx="40" cy="240" r="2"/>
    <circle cx="80" cy="260" r="2"/>
    <circle cx="160" cy="250" r="2"/>
    <circle cx="220" cy="230" r="2"/>
    <circle cx="250" cy="250" r="2"/>
  </g>
  <!-- 中心圆 -->
  <circle cx="144" cy="144" r="100" fill="#0f172a" stroke="url(#ring)" stroke-width="4"/>
  <!-- 字母 Y（代表 颜 / 颜当峻） -->
  <text x="144" y="178" text-anchor="middle" fill="#38bdf8" font-family="ui-sans-serif,system-ui,sans-serif" font-size="96" font-weight="800" letter-spacing="-2">Y</text>
  <!-- 副标题 -->
  <text x="144" y="215" text-anchor="middle" fill="#64748b" font-family="ui-monospace,monospace" font-size="11" letter-spacing="3">ydj001.xyz</text>
</svg>